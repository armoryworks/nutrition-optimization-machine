server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # The marketing site's sign-in is an embedded element now, not an iframe;
    # nothing legitimate frames this app.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # robots.txt — without this the SPA fallback answers it via try_files, so
    # crawlers get index.html with a 200: HTML served as a robots file, carrying
    # no crawl directives at all. `location =` is an exact match and terminates
    # nginx's search, so this wins over `location /` wherever it sits in the
    # file — it is placed here to read in order, not for precedence. The app has
    # public surfaces (recipe browsing) worth indexing; /api/ never is. Broader
    # indexing policy for this host is a product decision — revisit if the
    # public recipe wall should rank on its own.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\nDisallow: /api/\n";
    }

    # SPA routing — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Embeddable login element (loaded by the marketing site). main.js keeps a
    # stable unhashed name, so it must not inherit the immutable 1y cache
    # below. Module scripts are fetched in CORS mode, so the cross-origin
    # marketing page needs an explicit allow (public static JS — '*' is fine).
    location ^~ /elements/ {
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Per-instance runtime config — a deploy-time knob with a stable unhashed
    # name. It must never inherit the immutable 1y cache below, or a config
    # change stays invisible to returning visitors (and CDNs) for a year.
    location = /config.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass ${API_URL};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
