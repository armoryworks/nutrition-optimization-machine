<div class="nom-page-container forgot-password">
  <amw-card
    headerTitle="Forgot Password"
    headerSubtitle="Enter your email address and we'll send you a password reset link."
    headerIcon="lock_reset">
    <ng-template #contentTemplate>
      @if (isLoading()) {
        <amw-progress-bar
          mode="indeterminate"
          color="primary"
          class="nom-card__progress-bar">
        </amw-progress-bar>
      }
      <p class="nom-instruction-text">
        Enter the email address associated with your account and we'll send you
        a link to reset your password.
      </p>
      <form
        [formGroup]="forgotPasswordForm"
        (ngSubmit)="onSubmit()"
        class="nom-form">
        <amw-input
          type="email"
          formControlName="email"
          label="Email Address"
          icon="email"
          [required]="true"
          class="nom-form__field">
        </amw-input>

        <amw-button
          type="submit"
          variant="filled"
          color="primary"
          [disabled]="forgotPasswordForm.invalid || isLoading()"
          [loading]="isLoading()"
          class="nom-button">
          Send Reset Link
        </amw-button>
      </form>
    </ng-template>
    <ng-template #actionsTemplate>
      <p class="nom-prompt-text">
        Remembered your password?
        <a routerLink="/login" class="nom-link">Back to Login</a>
      </p>
    </ng-template>
  </amw-card>
</div>
