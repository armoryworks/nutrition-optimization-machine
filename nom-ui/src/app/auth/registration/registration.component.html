<div class="nom-page-container registration">
  <amw-card
    headerTitle="Create Your Account"
    headerIcon="person_add">
    <ng-template #contentTemplate>
      @if (isLoading()) {
        <mat-progress-bar
          mode="indeterminate"
          color="primary"
          class="nom-card__progress-bar">
        </mat-progress-bar>
      }
      <form
        [formGroup]="registrationForm"
        (ngSubmit)="onSubmit()"
        class="nom-form">
        <!-- Email Field - Using AMW -->
        <amw-input
          type="email"
          formControlName="email"
          label="Email Address"
          placeholder="Enter your email address..."
          [required]="true"
          endIcon="email"
          class="nom-form__field"
          data-cy="email-input">
        </amw-input>

        <!-- Full Name Field - Using AMW -->
        <amw-input
          type="text"
          formControlName="fullName"
          label="Full Name (Optional)"
          placeholder="Enter your full name..."
          endIcon="person"
          class="nom-form__field"
          data-cy="full-name-input">
        </amw-input>

        <!-- Password Field - Using AMW -->
        <amw-input
          type="password"
          formControlName="password"
          label="Password"
          placeholder="Enter your password..."
          [required]="true"
          endIcon="lock"
          [showPasswordToggle]="true"
          class="nom-form__field"
          data-cy="password-input">
        </amw-input>

        <!-- Confirm Password Field - Using AMW -->
        <amw-input
          type="password"
          formControlName="confirmPassword"
          label="Confirm Password"
          placeholder="Confirm your password..."
          [required]="true"
          endIcon="lock_open"
          [showPasswordToggle]="true"
          class="nom-form__field"
          data-cy="confirm-password-input">
        </amw-input>

        <!-- Password mismatch error -->
        @if (registrationForm.hasError('mismatch') &&
        registrationForm.get('confirmPassword')?.touched) {
          <p class="nom-form__error form-level-error">
            Passwords do not match.
          </p>
        }

        <amw-button
          type="submit"
          variant="filled"
          color="primary"
          [loading]="isLoading()"
          [disabled]="registrationForm.invalid"
          class="nom-button"
          data-cy="register-button">
          Register Account
        </amw-button>
      </form>
    </ng-template>
    <ng-template #actionsTemplate>
      <p class="nom-prompt-text">
        Already have an account?
        <span class="nom-link" (click)="openUserMenuFromFooter()" (keyup.enter)="openUserMenuFromFooter()" tabindex="0" role="button" aria-label="Login here">Login Here</span>
      </p>
    </ng-template>
  </amw-card>
</div>
