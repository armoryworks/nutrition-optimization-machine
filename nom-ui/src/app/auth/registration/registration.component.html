<div class="registration">
  <h2 class="registration__title">Create Your Account</h2>

  <form [formGroup]="registrationForm" (ngSubmit)="onSubmit()" class="registration__form">
    <amw-input
      type="email"
      formControlName="email"
      label="Email Address"
      [required]="true"
      data-cy="email-input">
    </amw-input>

    <amw-input
      type="text"
      formControlName="fullName"
      label="Full Name (Optional)"
      data-cy="full-name-input">
    </amw-input>

    <amw-input
      type="password"
      formControlName="password"
      label="Password"
      [required]="true"
      [showPasswordToggle]="true"
      data-cy="password-input">
    </amw-input>

    <amw-input
      type="password"
      formControlName="confirmPassword"
      label="Confirm Password"
      [required]="true"
      [showPasswordToggle]="true"
      data-cy="confirm-password-input">
    </amw-input>

    <div class="registration__actions">
      <span class="registration__login-prompt">
        Already have an account?
        <button type="button" class="nom-link" (click)="openUserMenuFromFooter()">Login</button>
      </span>
      <amw-button
        type="submit"
        variant="filled"
        color="primary"
        [amwValidationTooltip]="validationContext"
        [disabled]="registrationForm.invalid"
        data-cy="register-button">
        Register Account
      </amw-button>
    </div>
  </form>
</div>
