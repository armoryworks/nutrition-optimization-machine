<div class="nom-dashboard">
  <header class="nom-dashboard__header">
    <div class="nom-dashboard__header-left">
      <amw-button variant="text" icon="arrow_back" (click)="cancel()" data-testid="cookbook-edit-back-btn">Back</amw-button>
      <h1 class="nom-dashboard__title">Edit Cookbook</h1>
    </div>
  </header>

  @if (loading()) {
    <div class="nom-dashboard__loading">
      <amw-inline-loading message="Loading cookbook..." />
    </div>
  }

  @if (!loading() && cookbook()) {
    <div class="nom-form">
      @if (error()) {
        <div class="nom-dashboard__error" role="alert">
          <amw-icon name="error_outline"></amw-icon>
          <p>{{ error() }}</p>
        </div>
      }

      <div class="nom-form__field">
        <label class="nom-form__label" for="name">Name</label>
        <input class="nom-form__input" id="name" type="text" [(ngModel)]="model.name" maxlength="255" data-testid="cookbook-edit-name-input" />
      </div>

      <div class="nom-form__field">
        <label class="nom-form__label" for="description">Description</label>
        <textarea class="nom-form__input nom-form__textarea" id="description" [(ngModel)]="model.description" maxlength="2047" data-testid="cookbook-edit-description-input"></textarea>
      </div>

      <div class="nom-form__field nom-form__field--checkbox">
        <label class="nom-form__label">
          <input type="checkbox" [(ngModel)]="model.isPublic" data-testid="cookbook-edit-public-checkbox" />
          Make this cookbook public
        </label>
      </div>

      <div class="nom-form__actions">
        <amw-button variant="text" (click)="cancel()" [disabled]="saving()" data-testid="cookbook-edit-cancel-btn">Cancel</amw-button>
        <amw-button variant="filled" color="primary" icon="save" (click)="save()" [disabled]="saving()" data-testid="cookbook-edit-save-btn">
          {{ saving() ? 'Saving...' : 'Save Changes' }}
        </amw-button>
      </div>
    </div>
  }
</div>
