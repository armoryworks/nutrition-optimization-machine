<div class="nom-form--card">
  <div class="nom-form__card">
    <div class="nom-form__card-icon">
      <amw-icon name="menu_book"></amw-icon>
    </div>
    <div class="nom-form__card-header">
      <h1 class="nom-form__card-title">Create Cookbook</h1>
      <p class="nom-form__card-subtitle">Organize your recipes into a themed collection</p>
    </div>
    <div class="nom-form__card-content">
      <form [formGroup]="cookbookForm" (ngSubmit)="onSubmit()" class="nom-form__fields">
        <amw-input
          type="text"
          formControlName="name"
          placeholder="My Cookbook"
          label="Cookbook Name"
          [required]="true"
          data-testid="cookbook-create-name-input">
        </amw-input>

        <amw-textarea
          formControlName="description"
          placeholder="A collection of..."
          label="Description (Optional)"
          data-testid="cookbook-create-description-input">
        </amw-textarea>

        <amw-checkbox
          formControlName="isPublic"
          label="Make this cookbook public"
          data-testid="cookbook-create-public-checkbox">
        </amw-checkbox>
      </form>
    </div>
    <div class="nom-form__card-actions">
      <amw-button
        type="button"
        variant="text"
        [disabled]="isLoading()"
        (click)="onCancel()"
        data-testid="cookbook-create-cancel-btn">
        Cancel
      </amw-button>
      <amw-button
        type="submit"
        variant="filled"
        color="primary"
        [loading]="isLoading()"
        [amwValidationTooltip]="validationContext"
        [disabled]="cookbookForm.invalid"
        (click)="onSubmit()"
        data-testid="cookbook-create-submit-btn">
        Create Cookbook
      </amw-button>
    </div>
  </div>
</div>
