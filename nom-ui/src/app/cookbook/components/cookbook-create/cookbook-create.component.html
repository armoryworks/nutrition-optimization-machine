<div class="nom-dashboard">
  <header class="nom-dashboard__header">
    <div class="nom-dashboard__header-left">
      <amw-button variant="text" icon="arrow_back" (click)="cancel()">Back</amw-button>
      <h1 class="nom-dashboard__title">Create Cookbook</h1>
    </div>
  </header>

  <div class="nom-form">
    @if (error()) {
      <div class="nom-dashboard__error" role="alert">
        <amw-icon name="error_outline"></amw-icon>
        <p>{{ error() }}</p>
      </div>
    }

    <div class="nom-form__field">
      <label class="nom-form__label" for="name">Name</label>
      <input class="nom-form__input" id="name" type="text" [(ngModel)]="model.name" maxlength="255" placeholder="My Cookbook" />
    </div>

    <div class="nom-form__field">
      <label class="nom-form__label" for="description">Description</label>
      <textarea class="nom-form__input nom-form__textarea" id="description" [(ngModel)]="model.description" maxlength="2047" placeholder="A collection of..."></textarea>
    </div>

    <div class="nom-form__field nom-form__field--checkbox">
      <label class="nom-form__label">
        <input type="checkbox" [(ngModel)]="model.isPublic" />
        Make this cookbook public
      </label>
    </div>

    <div class="nom-form__actions">
      <amw-button variant="text" (click)="cancel()" [disabled]="saving()">Cancel</amw-button>
      <amw-button variant="filled" color="primary" icon="save" (click)="save()" [disabled]="saving()">
        {{ saving() ? 'Creating...' : 'Create Cookbook' }}
      </amw-button>
    </div>
  </div>
</div>
