<div class="nom-page-container nom-meal-plan-calendar">
  <!-- Loading State -->
  @if (isLoading()) {
    <div class="nom-loading-state">
      <amw-inline-loading message="Loading meal plans..." />
    </div>
  }

  <!-- Error State -->
  @if (error() && !isLoading()) {
    <div class="nom-error-state" role="alert">
      <p>{{ error() }}</p>
      <amw-button variant="filled" color="primary" (click)="onRetry()">
        Retry
      </amw-button>
    </div>
  }

  <!-- Calendar View -->
  @if (!isLoading() && !error()) {
    <amw-calendar-full
      [events]="calendarEvents()"
      [config]="calendarConfig()"
      [currentDate]="currentDate()"
      [view]="currentView()"
      [showNavigation]="true"
      [showViewSwitcher]="true"
      [showTodayButton]="true"
      [showCreateButton]="true"
      height="calc(100vh - 200px)"
      (eventClick)="onEventClick($event)"
      (eventChange)="onEventChange($event)"
      (cellClick)="onCellClick($event)"
      (cellDoubleClick)="onCellClick($event)"
      (viewChange)="onViewChange($event)"
      (dateChange)="onDateChange($event)"
    />
  }
</div>
