<div class="nom-page-container meal-plan-create">
  <amw-card
    class="nom-card"
    headerTitle="Create Meal Plan"
    headerSubtitle="Create a new meal plan to organize your meals">
    <ng-template #contentTemplate>
      @if (isLoading()) {
        <mat-progress-bar
          mode="indeterminate"
          color="primary"
          class="nom-card__progress-bar">
        </mat-progress-bar>
      }

      <form
        [formGroup]="mealPlanForm"
        (ngSubmit)="onSubmit()"
        class="nom-form">
        <amw-input
          formControlName="recipeName"
          label="Recipe Name"
          placeholder="Enter recipe name..."
          icon="restaurant_menu"
          [required]="true"
          class="nom-form__field">
        </amw-input>

        <amw-select
          formControlName="mealType"
          label="Meal Type"
          [options]="mealTypes"
          [required]="true"
          class="nom-form__field">
        </amw-select>

        <amw-datepicker
          formControlName="date"
          label="Date"
          [required]="true"
          class="nom-form__field">
        </amw-datepicker>

        <amw-textarea
          formControlName="description"
          label="Description (Optional)"
          placeholder="Add a description for your meal plan..."
          [rows]="3"
          class="nom-form__field">
        </amw-textarea>

        <div class="nom-form__actions">
          <amw-button
            type="button"
            variant="text"
            (click)="onCancel()"
            class="nom-button">
            Cancel
          </amw-button>
          <amw-button
            type="submit"
            variant="filled"
            color="primary"
            [disabled]="mealPlanForm.invalid || isLoading()"
            [loading]="isLoading()"
            class="nom-button">
            Create Meal Plan
          </amw-button>
        </div>
      </form>
    </ng-template>
  </amw-card>
</div>
