<div class="nom-page-container meal-plan-recipe-selection">
  @if (isLoading()) {
  <amw-inline-loading message="Loading..." />
  }

  @if (!isLoading() && !error()) {
  <div class="nom-container">
  <amw-card>
    <ng-template #cardContent>
      <amw-input label="Search" placeholder="Search recipes..." (input)="onSearch($event)"></amw-input>
    </ng-template>
  </amw-card>
</div>
}
</div>
