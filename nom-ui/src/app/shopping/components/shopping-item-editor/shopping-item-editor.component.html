<div class="nom-page-container shopping-item-editor">
  <form [formGroup]="itemForm" (ngSubmit)="onSubmit()">
    <div class="editor-content">
      <div class="form-row">
        <amw-input
          data-testid="shopping-item-editor-name-input"
          type="text"
          formControlName="name"
          label="Item Name"
          placeholder="Enter item name"
          [required]="true"
          class="full-width"
          [attr.aria-invalid]="itemForm.get('name')?.invalid && itemForm.get('name')?.touched"
          [attr.aria-describedby]="itemForm.get('name')?.invalid && itemForm.get('name')?.touched ? 'item-name-error' : null">
        </amw-input>
        @if (itemForm.get('name')?.invalid && itemForm.get('name')?.touched) {
          <span id="item-name-error" class="nom-form__error" role="alert">
            Item name is required
          </span>
        }
      </div>

      <div class="form-row">
        <amw-input
          data-testid="shopping-item-editor-description-input"
          type="text"
          formControlName="description"
          label="Description"
          placeholder="Enter description (optional)"
          class="full-width">
        </amw-input>
      </div>

      <div class="form-row two-columns">
        <amw-input
          data-testid="shopping-item-editor-quantity-input"
          type="number"
          formControlName="quantity"
          label="Quantity"
          [required]="true"
          class="quantity-field"
          [attr.aria-invalid]="itemForm.get('quantity')?.invalid && itemForm.get('quantity')?.touched"
          [attr.aria-describedby]="itemForm.get('quantity')?.invalid && itemForm.get('quantity')?.touched ? 'item-quantity-error' : null">
        </amw-input>
        @if (itemForm.get('quantity')?.invalid && itemForm.get('quantity')?.touched) {
          <span id="item-quantity-error" class="nom-form__error" role="alert">
            Quantity is required
          </span>
        }

        <amw-select
          data-testid="shopping-item-editor-unit-select"
          formControlName="unit"
          label="Unit"
          [options]="getUnitOptions()"
          class="unit-field">
        </amw-select>
      </div>

      <div class="form-row two-columns">
        <app-reference-selector
          data-testid="shopping-item-editor-category-selector"
          [discriminatorId]="REFERENCE_IDS.SHOPPING_CATEGORY_TYPE"
          [control]="itemForm.get('categoryId')!"
          label="Category"
          placeholder="Select category"
          class="category-field">
        </app-reference-selector>

        <app-reference-selector
          data-testid="shopping-item-editor-priority-selector"
          [discriminatorId]="REFERENCE_IDS.SHOPPING_PRIORITY_TYPE"
          [control]="itemForm.get('priorityId')!"
          label="Priority"
          placeholder="Select priority"
          class="priority-field">
        </app-reference-selector>
      </div>

      <div class="form-row">
        <amw-checkbox
          data-testid="shopping-item-editor-completed-checkbox"
          formControlName="isCompleted"
          label="Mark as completed">
        </amw-checkbox>
      </div>
    </div>

    <div class="editor-actions">
      <amw-button
        data-testid="shopping-item-editor-cancel-btn"
        type="button"
        variant="text"
        (click)="onCancel()"
        [disabled]="isSubmitting()">
        Cancel
      </amw-button>
      <amw-button
        data-testid="shopping-item-editor-submit-btn"
        type="submit"
        variant="filled"
        color="primary"
        [disabled]="itemForm.invalid || isSubmitting()">
        {{ getSubmitText() }}
      </amw-button>
    </div>
  </form>
</div>
