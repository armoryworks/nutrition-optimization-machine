<div class="shopping-item-dialog">
  <h2 mat-dialog-title>{{ getTitle() }}</h2>
  
  <form [formGroup]="itemForm" (ngSubmit)="onSubmit()">
    <mat-dialog-content>
      <div class="form-row">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Item Name *</mat-label>
          <input matInput formControlName="name" placeholder="Enter item name">
          <mat-error *ngIf="itemForm.get('name')?.hasError('required')">
            Item name is required
          </mat-error>
          <mat-error *ngIf="itemForm.get('name')?.hasError('maxlength')">
            Item name cannot exceed 255 characters
          </mat-error>
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Description</mat-label>
          <textarea matInput formControlName="description" placeholder="Optional description" rows="2"></textarea>
          <mat-error *ngIf="itemForm.get('description')?.hasError('maxlength')">
            Description cannot exceed 1000 characters
          </mat-error>
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline" class="quantity-field">
          <mat-label>Quantity *</mat-label>
          <input matInput type="number" formControlName="quantity" min="0.01" step="0.01">
          <mat-error *ngIf="itemForm.get('quantity')?.hasError('required')">
            Quantity is required
          </mat-error>
          <mat-error *ngIf="itemForm.get('quantity')?.hasError('min')">
            Quantity must be greater than 0
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="unit-field">
          <mat-label>Unit</mat-label>
          <mat-select formControlName="unit">
            <mat-option *ngFor="let unit of units" [value]="unit">
              {{ unit }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <div class="form-row">
        <app-reference-selector
          [discriminatorId]="REFERENCE_IDS.SHOPPING_CATEGORY_TYPE"
          [control]="itemForm.get('categoryId')!"
          label="Category"
          placeholder="Select category"
          class="category-field">
        </app-reference-selector>

        <app-reference-selector
          [discriminatorId]="REFERENCE_IDS.SHOPPING_PRIORITY_TYPE"
          [control]="itemForm.get('priorityId')!"
          label="Priority"
          placeholder="Select priority"
          class="priority-field">
        </app-reference-selector>
      </div>

      <div class="form-row">
        <mat-checkbox formControlName="isCompleted">
          Mark as completed
        </mat-checkbox>
      </div>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
      <button mat-button type="button" (click)="onCancel()" [disabled]="isSubmitting">
        Cancel
      </button>
      <button mat-raised-button color="primary" type="submit" [disabled]="itemForm.invalid || isSubmitting">
        {{ getSubmitText() }}
      </button>
    </mat-dialog-actions>
  </form>
</div>
