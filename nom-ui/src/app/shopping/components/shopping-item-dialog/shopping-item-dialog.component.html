<div class="shopping-item-dialog">
  <h2 mat-dialog-title>{{ getTitle() }}</h2>

  <form [formGroup]="itemForm" (ngSubmit)="onSubmit()">
    <mat-dialog-content>
      <div class="form-row">
        <amw-input
          type="text"
          formControlName="name"
          label="Item Name"
          placeholder="Enter item name"
          [required]="true"
          class="full-width">
        </amw-input>
      </div>

      <div class="form-row">
        <amw-input
          type="text"
          formControlName="description"
          label="Description"
          placeholder="Enter description (optional)"
          class="full-width">
        </amw-input>
      </div>

      <div class="form-row two-columns">
        <amw-input
          type="number"
          formControlName="quantity"
          label="Quantity"
          [required]="true"
          class="quantity-field">
        </amw-input>

        <amw-select
          formControlName="unit"
          label="Unit"
          [options]="getUnitOptions()"
          class="unit-field">
        </amw-select>
      </div>

      <div class="form-row two-columns">
        <app-reference-selector
          [discriminatorId]="REFERENCE_IDS.SHOPPING_CATEGORY_TYPE"
          [control]="itemForm.get('categoryId')!"
          label="Category"
          placeholder="Select category"
          class="category-field">
        </app-reference-selector>

        <app-reference-selector
          [discriminatorId]="REFERENCE_IDS.SHOPPING_PRIORITY_TYPE"
          [control]="itemForm.get('priorityId')!"
          label="Priority"
          placeholder="Select priority"
          class="priority-field">
        </app-reference-selector>
      </div>

      <div class="form-row">
        <amw-checkbox
          formControlName="isCompleted"
          label="Mark as completed">
        </amw-checkbox>
      </div>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
      <amw-button
        type="button"
        variant="text"
        (click)="onCancel()"
        [disabled]="isSubmitting()">
        Cancel
      </amw-button>
      <amw-button
        type="submit"
        variant="filled"
        color="primary"
        [disabled]="itemForm.invalid || isSubmitting()">
        {{ getSubmitText() }}
      </amw-button>
    </mat-dialog-actions>
  </form>
</div>
