<div class="nom-form--card">
  <div class="nom-form__card">
    <div class="nom-form__card-icon">
      <amw-icon name="shopping_cart"></amw-icon>
    </div>
    <div class="nom-form__card-header">
      <h1 class="nom-form__card-title">{{ formConfig.title }}</h1>
      @if (formConfig.subtitle) {
        <p class="nom-form__card-subtitle">{{ formConfig.subtitle }}</p>
      }
    </div>
    <div class="nom-form__card-content">
      <form [formGroup]="shoppingForm" (ngSubmit)="onSubmit()" class="nom-form__fields">
        <amw-input
          type="text"
          formControlName="name"
          placeholder="Enter a name for your shopping list..."
          label="Shopping List Name"
          [required]="true"
          data-testid="shopping-name-input">
        </amw-input>

        <amw-textarea
          formControlName="description"
          placeholder="Add a description for your shopping list..."
          label="Description (Optional)"
          data-testid="shopping-description-input">
        </amw-textarea>
      </form>
    </div>
    <div class="nom-form__card-actions">
      <amw-button
        type="button"
        variant="text"
        [disabled]="isLoading()"
        (click)="onCancel()">
        {{ formConfig.cancelText || 'Cancel' }}
      </amw-button>
      <amw-button
        type="submit"
        variant="filled"
        color="primary"
        [loading]="isLoading()"
        [amwValidationTooltip]="validationContext"
        [disabled]="shoppingForm.invalid"
        (click)="onSubmit()"
        data-testid="shopping-submit-btn">
        {{ formConfig.submitText || 'Create Shopping List' }}
      </amw-button>
    </div>
  </div>
</div>
