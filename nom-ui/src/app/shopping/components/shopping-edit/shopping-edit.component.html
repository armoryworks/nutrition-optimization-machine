<div class="shopping-edit">
  <amw-card [headerTitle]="formConfig.title" [headerSubtitle]="formConfig.subtitle || ''" headerIcon="shopping_cart"
    class="shopping-edit__card">
    <ng-template #cardContent>
      @if (isLoading() && !shoppingList()) {
      <div class="shopping-edit__loading" role="status" aria-live="polite" aria-label="Loading shopping list">
        <amw-progress-spinner [diameter]="40"></amw-progress-spinner>
        <p>Loading shopping list...</p>
      </div>
      } @else {
      <form [formGroup]="shoppingForm" (ngSubmit)="onSubmit()" class="shopping-edit__form">
        <!-- Shopping List Name Field - Using AMW -->
        <amw-input type="text" formControlName="name" placeholder="Enter a name for your shopping list..."
          label="Shopping List Name" [required]="true" class="shopping-edit__field"
          [attr.aria-invalid]="shoppingForm.get('name')?.invalid && shoppingForm.get('name')?.touched"
          [attr.aria-describedby]="shoppingForm.get('name')?.invalid && shoppingForm.get('name')?.touched ? 'shopping-edit-name-error' : null">
        </amw-input>
        @if (shoppingForm.get('name')?.invalid && shoppingForm.get('name')?.touched) {
          <span id="shopping-edit-name-error" class="nom-form__error" role="alert">
            Shopping list name is required
          </span>
        }

        <!-- Description Field - Using AMW -->
        <amw-textarea formControlName="description" placeholder="Add a description for your shopping list..."
          label="Description (Optional)" class="shopping-edit__field">
        </amw-textarea>

        <!-- Form Actions -->
        <div class="shopping-edit__actions">
          <amw-button type="button" variant="text" icon="close" [disabled]="isLoading()" (click)="onCancel()">
            {{ formConfig.cancelText || 'Cancel' }}
          </amw-button>

          <amw-button type="submit" variant="filled" color="primary" icon="check" [loading]="isLoading()"
            [amwValidationTooltip]="validationContext"
            [disabled]="shoppingForm.invalid">
            {{ formConfig.submitText || 'Update Shopping List' }}
          </amw-button>
        </div>
      </form>
      }
    </ng-template>
  </amw-card>
</div>
