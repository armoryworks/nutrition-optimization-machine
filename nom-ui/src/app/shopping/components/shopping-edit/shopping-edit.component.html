<div class="nom-form--full">
  <amw-card [headerTitle]="formConfig.title" [headerSubtitle]="formConfig.subtitle || ''" headerIcon="shopping_cart">
    <ng-template #cardContent>
      @if (isLoading() && !shoppingList()) {
        <amw-inline-loading message="Loading shopping list..." />
      } @else {
        <form [formGroup]="shoppingForm" (ngSubmit)="onSubmit()" class="nom-form__fields">
          <amw-input
            data-testid="shopping-edit-name-input"
            type="text"
            formControlName="name"
            placeholder="Enter a name for your shopping list..."
            label="Shopping List Name"
            [required]="true">
          </amw-input>
          <amw-textarea
            data-testid="shopping-edit-description-input"
            formControlName="description"
            placeholder="Add a description for your shopping list..."
            label="Description (Optional)">
          </amw-textarea>
        </form>
        <div class="nom-form__actions">
          <amw-button data-testid="shopping-edit-cancel-btn" type="button" variant="text" icon="close" [disabled]="isLoading()" (click)="onCancel()">
            {{ formConfig.cancelText || 'Cancel' }}
          </amw-button>
          <amw-button
            data-testid="shopping-edit-submit-btn"
            type="submit"
            variant="filled"
            color="primary"
            icon="check"
            [loading]="isLoading()"
            [amwValidationTooltip]="validationContext"
            [disabled]="shoppingForm.invalid"
            (click)="onSubmit()">
            {{ formConfig.submitText || 'Update Shopping List' }}
          </amw-button>
        </div>
      }
    </ng-template>
  </amw-card>
</div>
