<div class="measurement-list">
  <amw-card class="measurement-list__card" headerTitle="Measurement Units"
    headerSubtitle="Manage measurement units and conversion factors">
    <ng-template #cardContent>
      @if (isLoading()) {
      <amw-inline-loading message="Loading measurements..." />
      } @else if (error()) {
      <div class="measurement-list__error">
        <amw-icon name="error" color="warn"></amw-icon>
        <p>{{ error() }}</p>
        <amw-button variant="text" color="primary" (click)="onRefresh()">Retry</amw-button>
      </div>
      } @else {
      <div class="measurement-list__table-container">
        @if (measurements().length === 0) {
        <div class="measurement-list__empty">
          <amw-icon name="inbox"></amw-icon>
          <p>No measurements found</p>
        </div>
        } @else {
        <amw-data-table [config]="tableConfig" [columns]="tableColumns" [data]="measurements()"
          (rowClick)="onEdit($event)" class="measurement-list__table">
        </amw-data-table>
        }
      </div>
      }

      <div class="measurement-list__actions">
        <amw-button variant="filled" color="primary" (click)="onRefresh()" icon="refresh">
          Refresh
        </amw-button>
      </div>
    </ng-template>
  </amw-card>
</div>
