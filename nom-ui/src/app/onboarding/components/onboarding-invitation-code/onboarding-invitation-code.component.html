<div class="nom-section">
  <h3 class="nom-section__heading">Join an Existing Plan (Optional)</h3>
  <p class="nom-instruction-text">
    Do you have an invitation code to join an existing plan?
  </p>
  <amw-input
    data-testid="onboarding-code-input"
    [formControl]="invitationCodeFormControl"
    label="Invitation Code"
    placeholder="Enter code"
    class="nom-form__field nom-form__field--centered"
    [attr.aria-invalid]="errorMessage() ? true : null"
    [attr.aria-describedby]="errorMessage() ? 'invitation-code-error' : null">
  </amw-input>
  @if (errorMessage()) {
  <p id="invitation-code-error" class="nom-form__error" role="alert">{{ errorMessage() }}</p>
  }
  <div class="flex justify-center mt-4">
    <amw-button
      data-testid="onboarding-code-join-btn"
      variant="filled"
      color="primary"
      (click)="onSubmit()"
      [disabled]="!invitationCodeFormControl.value || isLoading()"
      [loading]="isLoading()"
      class="mr-2">
      Join Plan
    </amw-button>
    <amw-button
      data-testid="onboarding-code-skip-btn"
      variant="filled"
      color="accent"
      (click)="onSkip()"
      [disabled]="isLoading()">
      I have no Invitation Code
    </amw-button>
  </div>
</div>
