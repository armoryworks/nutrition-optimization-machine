<amw-card
  class="nom-card"
  [headerTitle]="plan ? 'Edit Plan' : 'Create New Plan'">
  <ng-template #contentTemplate>
    <form [formGroup]="planForm" class="nom-form">
      <amw-input
        formControlName="name"
        label="Plan Name"
        placeholder="Enter plan name"
        [required]="true"
        class="nom-form__field">
      </amw-input>

      <amw-textarea
        formControlName="description"
        label="Description"
        placeholder="Describe your plan"
        class="nom-form__field">
      </amw-textarea>

      <amw-input
        formControlName="invitationCode"
        label="Invitation Code"
        placeholder="Auto-generated or custom code"
        class="nom-form__field">
      </amw-input>

      <!-- Restriction Editing Section -->
      <!-- Temporarily disabled due to type mismatch between plan and restriction models -->
      <!--

        </p>

        @if (currentRestrictionType === null) {

      <!-- Display currently added restrictions for review -->
      @if (tempRestrictions.length > 0) {
      <div class="nom-section mt-6">
        <h4 class="nom-section__subheading">Current Restrictions</h4>
        <ul class="list-disc pl-5">
          @for (res of tempRestrictions; track res.id || res.name) {
          <li>
            {{ res.restrictionType || 'Restriction' }}:
            {{ res.name }}
            @if (res.description) { - {{ res.description }} }
          </li>
          }
        </ul>
      </div>
      }
      <!-- End Restriction Display -->
    </form>

    <div class="nom-card__footer">
      <amw-button variant="filled" color="accent" (click)="goBack()">Back</amw-button>
      <amw-button variant="filled" color="primary" (click)="submitForm()">
        Save Plan
      </amw-button>
    </div>
  </ng-template>
</amw-card>
