<h2 mat-dialog-title data-testid="clone-plan-dialog">Clone Plan</h2>
<mat-dialog-content>
  <p>Enter a name for your copy of "{{ data.planName }}":</p>
  <mat-form-field class="nom-clone-plan__name-field">
    <mat-label>Plan Name</mat-label>
    <input matInput [formControl]="newName" maxlength="255">
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button [mat-dialog-close]="newName.value" [disabled]="!(newName.value ?? '').trim()" data-testid="clone-plan-clone-btn">Clone</button>
</mat-dialog-actions>
