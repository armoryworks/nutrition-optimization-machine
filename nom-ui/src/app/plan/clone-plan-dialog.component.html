<h2 mat-dialog-title>Clone Plan</h2>
<mat-dialog-content>
  <p>Enter a name for your copy of "{{ data.planName }}":</p>
  <mat-form-field style="width: 100%">
    <mat-label>Plan Name</mat-label>
    <input matInput [formControl]="newName" maxlength="255">
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button [mat-dialog-close]="newName.value" [disabled]="!(newName.value ?? '').trim()">Clone</button>
</mat-dialog-actions>
