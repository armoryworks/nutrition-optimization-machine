<div class="nom-recipe-edit nom-page-container">
    <div class="nom-card">
        <div class="nom-recipe-edit__header">
            <h1>{{ pageTitle }}</h1>
        </div>

        <div *ngIf="isLoading" class="nom-recipe-edit__loading-container">
            <mat-spinner diameter="50"></mat-spinner>
        </div>

        <form *ngIf="!isLoading" [formGroup]="recipeForm" (ngSubmit)="onSubmit()" class="nom-recipe-edit__form">
            <div class="nom-recipe-edit__form-field">
                <label for="name">Recipe Name</label>
                <input id="name" type="text" formControlName="name" placeholder="e.g., Classic Lasagna">
            </div>

            <div class="nom-recipe-edit__form-field">
                <label for="description">Description</label>
                <textarea id="description" formControlName="description" rows="4"
                    placeholder="A short summary of the recipe..."></textarea>
            </div>

            <div class="nom-recipe-edit__actions">
                <button type="button" class="nom-button--secondary"
                    (click)="router.navigate(['/user/dashboard'])">Cancel</button>
                <button type="submit" class="nom-button--primary" [disabled]="recipeForm.invalid">
                    {{ isEditMode ? 'Save Changes' : 'Create Recipe' }}
                </button>
            </div>
        </form>
    </div>
    </div>
