<div class="sidebar-panel">
  <div class="sidebar-panel__header">
    <amw-icon name="bolt"></amw-icon>
    <h3 class="sidebar-panel__title">Quick Actions</h3>
  </div>

  <div class="sidebar-quick-actions__grid">
    @for (action of actions; track action.route) {
    <a [routerLink]="action.route" class="sidebar-quick-actions__item">
      <amw-icon [name]="action.icon"></amw-icon>
      <span>{{ action.label }}</span>
    </a>
    }
  </div>
</div>
