<form [formGroup]="budgetForm" (ngSubmit)="onSave()" class="nom-budget-form" data-testid="budget-form">
  <div class="nom-budget-form__row">
    <mat-form-field appearance="outline" class="nom-budget-form__amount">
      <mat-label>Grocery budget</mat-label>
      <span matTextPrefix>$&nbsp;</span>
      <input matInput type="number" min="0" formControlName="amount" data-testid="budget-amount" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="nom-budget-form__period">
      <mat-label>Per</mat-label>
      <mat-select formControlName="period" data-testid="budget-period">
        <mat-option value="weekly">week</mat-option>
        <mat-option value="monthly">month</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  @if (errorMessage()) {
    <p class="nom-budget-form__error" data-testid="budget-error">{{ errorMessage() }}</p>
  }
  @if (successMessage()) {
    <p class="nom-budget-form__success" data-testid="budget-success">{{ successMessage() }}</p>
  }

  <div class="nom-budget-form__actions">
    <button mat-flat-button color="primary" type="submit" [disabled]="saving()" data-testid="budget-save-btn">
      {{ saving() ? 'Saving…' : 'Save Budget' }}
    </button>
  </div>
</form>
