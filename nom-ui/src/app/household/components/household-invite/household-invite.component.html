<div class="nom-page-container household-invite">
  <!-- Header -->
    <div class="household-invite__header">
      <div class="household-invite__header-content">
        <div class="household-invite__title-section">
          <amw-icon name="person_add" class="household-invite__title-icon"></amw-icon>
          <div class="household-invite__title-info">
            <h1 class="household-invite__title">Invite to Household</h1>
            <p class="household-invite__subtitle">Invite someone to join your household</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Invite Form -->
    <amw-card [headerTitle]="'Create Invitation'" headerIcon="mail">
      <ng-template #cardContent>
        <form [formGroup]="inviteForm" (ngSubmit)="onSubmit()" class="household-invite__form">
          <amw-input type="number" formControlName="expiresInDays" label="Expiration Days"
            placeholder="Enter number of days..." [required]="true" class="household-invite__field" data-testid="household-invite-days-input">
          </amw-input>

          <div class="household-invite__form-actions">
            <amw-button type="submit" variant="filled" color="primary" [icon]="isLoading() ? 'hourglass_empty' : 'send'"
              [amwValidationTooltip]="validationContext"
              [disabled]="inviteForm.invalid || isLoading()" [loading]="isLoading()" data-testid="household-invite-submit-btn">
              {{ isLoading() ? 'Creating...' : 'Create Invitation' }}
            </amw-button>
          </div>
        </form>
      </ng-template>
    </amw-card>

    <!-- Error Message -->
    @if (error()) {
    <div class="household-invite__error">
      <amw-card [headerTitle]="'Error Creating Invitation'" headerIcon="error">
        <ng-template #cardContent>
          <div class="household-invite__error-content">
            <p>{{ error() }}</p>
          </div>
        </ng-template>
      </amw-card>
    </div>
    }

    <!-- Invite Link Section -->
    @if (inviteLink()) {
    <div class="household-invite__invite-section">
      <amw-card [headerTitle]="'Invitation Link'" headerIcon="link">
        <ng-template #cardContent>
          <p class="household-invite__invite-subtitle">Share this link with the person you want to invite</p>
          <div class="household-invite__link-container">
            <amw-input [value]="inviteLink()" label="Invitation Link" [readonly]="true"
              class="household-invite__link-field" data-testid="household-invite-link-input">
            </amw-input>
            <amw-button variant="icon" (click)="copyLink()" data-testid="household-invite-copy-btn">
              <amw-icon name="content_copy"></amw-icon>
            </amw-button>
          </div>

          <div class="household-invite__link-actions">
            <amw-button variant="filled" color="primary" icon="share" (click)="shareLink()" data-testid="household-invite-share-btn">
              Share Link
            </amw-button>
          </div>
        </ng-template>
      </amw-card>
    </div>
    }
</div>
