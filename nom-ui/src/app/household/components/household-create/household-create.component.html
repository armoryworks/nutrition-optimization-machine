<div class="nom-form--card">
  <div class="nom-form__card">
    <div class="nom-form__card-icon">
      <amw-icon name="home"></amw-icon>
    </div>
    <div class="nom-form__card-header">
      <h1 class="nom-form__card-title">{{ formConfig.title }}</h1>
    </div>
    <div class="nom-form__card-content">
      <form [formGroup]="householdForm" (ngSubmit)="onSubmit()" class="nom-form__fields">
        <amw-input
          type="text"
          formControlName="name"
          placeholder="Enter a name for your household..."
          label="Household Name"
          [required]="true"
          data-testid="household-name-input">
        </amw-input>

        <amw-textarea
          formControlName="description"
          placeholder="Add a description to help identify your household..."
          label="Description (Optional)"
          data-testid="household-description-input">
        </amw-textarea>
      </form>
    </div>
    <div class="nom-form__card-actions">
      <amw-button
        type="button"
        variant="text"
        [disabled]="isLoading()"
        (click)="onCancel()">
        {{ formConfig.cancelText || 'Cancel' }}
      </amw-button>
      <amw-button
        type="submit"
        variant="filled"
        color="primary"
        [loading]="isLoading()"
        [amwValidationTooltip]="validationContext"
        [disabled]="householdForm.invalid"
        (click)="onSubmit()"
        data-testid="household-submit-btn">
        {{ formConfig.submitText || 'Create Household' }}
      </amw-button>
    </div>
  </div>
</div>
