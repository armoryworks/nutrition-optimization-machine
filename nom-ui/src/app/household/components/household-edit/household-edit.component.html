<div class="household-edit">
  <div class="household-edit__container">
    <amw-card [headerTitle]="formConfig.title" headerIcon="home">
      <ng-template #contentTemplate>
        @if (isLoading() && !household()) {
          <div class="loading-container">
            <mat-spinner diameter="40"></mat-spinner>
            <p>Loading household...</p>
          </div>
        } @else {
          <form [formGroup]="householdForm" (ngSubmit)="onSubmit()">
            <!-- Household Name Field - Using AMW -->
            <amw-input
              type="text"
              formControlName="name"
              placeholder="Enter a name for your household..."
              label="Household Name"
              [required]="true"
              class="household-edit__field">
            </amw-input>

            <!-- Description Field - Using AMW -->
            <amw-textarea
              formControlName="description"
              placeholder="Add a description to help identify your household..."
              label="Description (Optional)"
              class="household-edit__field">
            </amw-textarea>

            <!-- Form Actions -->
            <div class="form-actions">
              <div class="action-buttons">
                <amw-button
                  type="button"
                  variant="text"
                  icon="close"
                  [disabled]="isLoading()"
                  (click)="onCancel()"
                  class="cancel-button">
                  {{ formConfig.cancelText || 'Cancel' }}
                </amw-button>

                <amw-button
                  type="submit"
                  variant="filled"
                  color="primary"
                  icon="check"
                  [loading]="isLoading()"
                  [disabled]="householdForm.invalid"
                  class="submit-button">
                  {{ formConfig.submitText || 'Update Household' }}
                </amw-button>
              </div>
            </div>
          </form>
        }
      </ng-template>
    </amw-card>
  </div>
</div>
