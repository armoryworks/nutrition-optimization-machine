<div class="nom-form--full">
  <amw-card [headerTitle]="formConfig.title" headerIcon="home">
    <ng-template #cardContent>
      @if (isLoading() && !household()) {
        <amw-inline-loading message="Loading household..." />
      } @else {
        <form [formGroup]="householdForm" (ngSubmit)="onSubmit()" class="nom-form__fields">
          <amw-input
            type="text"
            formControlName="name"
            placeholder="Enter a name for your household..."
            label="Household Name"
            [required]="true"
            data-testid="household-edit-name-input">
          </amw-input>
          <amw-textarea
            formControlName="description"
            placeholder="Add a description to help identify your household..."
            label="Description (Optional)"
            data-testid="household-edit-description-input">
          </amw-textarea>
        </form>
        <div class="nom-form__actions">
          <amw-button type="button" variant="text" icon="close" [disabled]="isLoading()" (click)="onCancel()" data-testid="household-edit-cancel-btn">
            {{ formConfig.cancelText || 'Cancel' }}
          </amw-button>
          <amw-button
            type="submit"
            variant="filled"
            color="primary"
            icon="check"
            [loading]="isLoading()"
            [amwValidationTooltip]="validationContext"
            [disabled]="householdForm.invalid"
            (click)="onSubmit()"
            data-testid="household-edit-submit-btn">
            {{ formConfig.submitText || 'Update Household' }}
          </amw-button>
        </div>
      }
    </ng-template>
  </amw-card>
</div>
