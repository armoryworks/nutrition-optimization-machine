<app-base-form
  [config]="formConfig"
  [form]="householdForm"
  [loading]="isLoading"
  (submit)="onSubmit()"
  (cancel)="onCancel()"
>
  <div class="household-edit">
    <div class="household-edit__container">
      <!-- Name Field -->
      <div class="household-edit__field">
        <mat-form-field class="household-edit__input">
          <mat-label>Household Name</mat-label>
          <input 
            matInput 
            formControlName="Name" 
            placeholder="Enter household name"
            class="household-edit__input-field"
          >
          <mat-error *ngIf="householdForm.get('Name')?.hasError('required')">
            Household name is required
          </mat-error>
          <mat-error *ngIf="householdForm.get('Name')?.hasError('minlength')">
            Household name must be at least 2 characters
          </mat-error>
          <mat-error *ngIf="householdForm.get('Name')?.hasError('maxlength')">
            Household name cannot exceed 100 characters
          </mat-error>
        </mat-form-field>
      </div>

      <!-- Description Field -->
      <div class="household-edit__field">
        <mat-form-field class="household-edit__textarea">
          <mat-label>Description (Optional)</mat-label>
          <textarea 
            matInput 
            formControlName="Description" 
            placeholder="Enter household description"
            rows="4"
            class="household-edit__textarea-field"
          ></textarea>
          <mat-error *ngIf="householdForm.get('Description')?.hasError('maxlength')">
            Description cannot exceed 500 characters
          </mat-error>
        </mat-form-field>
      </div>
    </div>
  </div>
</app-base-form>
