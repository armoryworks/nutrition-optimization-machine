<!-- File: nom-ui/src/app/user/privacy-settings/privacy-settings.component.html -->
<div class="nom-page-container privacy-settings">
  <!-- Header -->
  <header class="nom-dashboard__header">
    <div class="nom-dashboard__header-left">
      <h1 class="nom-dashboard__title">Privacy Settings</h1>
      <span class="nom-dashboard__subtitle">Manage your data privacy and consent preferences</span>
    </div>
  </header>

    <!-- Loading State -->
    @if (isLoading()) {
    <amw-inline-loading message="Loading privacy settings..." />
    }

    <!-- Privacy Settings Form -->
    @if (!isLoading()) {
    <amw-card class="privacy-settings__form-card" headerTitle="Consent Preferences"
      headerSubtitle="Control how your data is used">
      <ng-template #cardContent>
        <form [formGroup]="privacyForm" (ngSubmit)="onSubmit()" class="privacy-settings__form">
          <div class="privacy-settings__consents-section">
            @for (consent of availableConsents; track consent.id) {
            <div class="privacy-settings__consent-item">
              <div class="privacy-settings__consent-info">
                <h3 class="privacy-settings__consent-title">{{ consent.name }}</h3>
                <p class="privacy-settings__consent-description">{{ consent.description }}</p>
              </div>
              <amw-toggle [formControlName]="consent.name || ''" color="primary"
                class="privacy-settings__consent-toggle">
              </amw-toggle>
            </div>
            }
          </div>

          <div class="privacy-settings__form-actions">
            <amw-button variant="filled" color="primary" type="submit"
              [amwValidationTooltip]="validationContext"
              [disabled]="privacyForm.invalid || isSubmitting()" [loading]="isSubmitting()"
              class="privacy-settings__submit-btn" icon="save">
              {{ isSubmitting() ? 'Saving...' : 'Save Privacy Settings' }}
            </amw-button>
          </div>
        </form>
      </ng-template>
    </amw-card>
    }
</div>
