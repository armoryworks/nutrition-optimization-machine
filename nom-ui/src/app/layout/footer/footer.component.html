<footer class="nom-footer" data-testid="footer">
  <div class="nom-footer__left">
    @if (marketingSite) {
      <a [href]="marketingSite" class="nom-footer__link" data-testid="footer-brand-link">Armory Works Technology</a>
    } @else {
      <span class="nom-footer__text" data-testid="footer-brand-text">Armory Works Technology</span>
    }
  </div>
  <div class="nom-footer__right">
    @if (termsUrl) {
      <a [href]="termsUrl" class="nom-footer__link" data-testid="footer-terms-link">Terms</a>
    } @else {
      <a routerLink="/terms" class="nom-footer__link" data-testid="footer-terms-link">Terms</a>
    }
    <span class="nom-footer__text">&copy; {{ currentYear }} NOM</span>
  </div>
</footer>
