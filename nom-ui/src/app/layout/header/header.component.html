<header class="nom-header" data-testid="header">
  @if (isLoggedIn()) {
    <button
      mat-icon-button
      class="nom-header__nav-toggle"
      data-testid="header-nav-toggle-btn"
      aria-label="Open navigation menu"
      (click)="navToggle.emit()"
    >
      <mat-icon>menu</mat-icon>
    </button>
  }
  <a class="nom-header__brand" routerLink="/home" aria-label="NOM — home">
    <span class="nom-header__brand-shield" aria-hidden="true"></span>
    <div class="nom-header__brand-text" aria-hidden="true">
      <span class="nom-header__brand-name">Nutrition Optimization</span>
      <span class="nom-header__brand-rule"></span>
      <span class="nom-header__brand-subtitle">Armory Works Technology</span>
    </div>
  </a>

  <div class="nom-header__search">
    <mat-icon class="nom-header__search-icon">search</mat-icon>
    <input
      type="text"
      class="nom-header__search-input"
      data-testid="header-search-input"
      [placeholder]="isLoggedIn() ? 'Search recipes, ingredients, plans...' : 'Search recipes...'"
      aria-label="Search"
      (keydown.enter)="onSearch($event)"
    />
  </div>

  <div class="nom-header__actions">
    <button
      mat-icon-button
      class="nom-header__action-btn"
      data-testid="header-theme-toggle-btn"
      (click)="themeToggle.emit()"
      [attr.aria-label]="isDarkTheme() ? 'Switch to light theme' : 'Switch to dark theme'"
    >
      <mat-icon>{{ isDarkTheme() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>

    @if (isLoggedIn()) {
      <button
        mat-icon-button
        class="nom-header__action-btn"
        data-testid="header-notifications-btn"
        aria-label="Notifications"
      >
        <mat-icon>notifications_none</mat-icon>
      </button>
      <button
        class="nom-header__avatar"
        data-testid="header-avatar-btn"
        (click)="toggleUserMenu()"
        aria-label="User menu"
        aria-haspopup="menu"
        [attr.aria-expanded]="userMenuOpen()"
      >
        <span>{{ userInitial() }}</span>
      </button>

      @if (userMenuOpen()) {
        <div
          class="nom-header__popover-backdrop"
          (click)="closeUserMenu()"
          aria-hidden="true"
        ></div>
        <nom-user-menu (closed)="closeUserMenu()"></nom-user-menu>
      }
    } @else {
      <button
        mat-flat-button
        color="primary"
        class="nom-header__login-btn"
        data-testid="header-login-btn"
        aria-haspopup="dialog"
        [attr.aria-expanded]="loginPopoverOpen()"
        (click)="toggleLoginPopover()"
      >
        <mat-icon>login</mat-icon>
        Sign In
      </button>

      @if (loginPopoverOpen()) {
        <div
          class="nom-header__popover-backdrop"
          (click)="loginPopoverOpen.set(false)"
          aria-hidden="true"
        ></div>
        <nom-login-popover (closed)="loginPopoverOpen.set(false)"></nom-login-popover>
      }
    }
  </div>
</header>
