<app-base-page
  [config]="pageConfig"
  [isLoading]="isLoading"
  [error]="error"
  (back)="onBack()"
  (refresh)="onRefresh()"
  (retry)="onRetry()">

  <app-base-form
    [config]="formConfig"
    [form]="personForm"
    [isSubmitting]="isSubmitting"
    (submit)="onSubmit()"
    (cancel)="onCancel()">
    
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Your Name</mat-label>
      <input
        matInput
        type="text"
        formControlName="name"
        placeholder="Enter your full name"
      />
      <mat-icon matSuffix>person</mat-icon>
      @if (personForm.get('name')?.hasError('required') && personForm.get('name')?.touched) {
        <mat-error>Name is required.</mat-error>
      }
    </mat-form-field>
  </app-base-form>
</app-base-page>
