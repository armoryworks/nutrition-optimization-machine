<div class="nom-page-container person-edit">
  <amw-card
    [headerTitle]="pageTitle"
    [headerSubtitle]="pageSubtitle"
    class="nom-card">
    <ng-template #contentTemplate>
      @if (isLoading()) {
        <mat-progress-bar mode="indeterminate" color="primary" class="nom-card__progress-bar"></mat-progress-bar>
      }

      @if (error()) {
        <div class="nom-error-state">
          <amw-icon name="error_outline" class="nom-error-state__icon"></amw-icon>
          <p class="nom-error-state__message">{{ error() }}</p>
          <div class="nom-error-state__actions">
            <amw-button variant="filled" color="primary" (click)="onRetry()">Try Again</amw-button>
          </div>
        </div>
      } @else {
        <form [formGroup]="personForm" (ngSubmit)="onSubmit()" class="nom-form">
          <amw-input
            formControlName="name"
            label="Your Name"
            placeholder="Enter your full name"
            icon="person"
            [required]="true"
            class="nom-form__field">
          </amw-input>

          <div class="nom-form__actions">
            <amw-button
              type="button"
              variant="text"
              (click)="onCancel()">
              {{ cancelText }}
            </amw-button>
            <amw-button
              type="submit"
              variant="filled"
              color="primary"
              [disabled]="personForm.invalid || isSubmitting()"
              [loading]="isSubmitting()">
              {{ submitText }}
            </amw-button>
          </div>
        </form>
      }
    </ng-template>
  </amw-card>
</div>
