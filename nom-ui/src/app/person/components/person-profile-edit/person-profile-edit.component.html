<div class="nom-form--full">
  <amw-card [headerTitle]="pageTitle" [headerSubtitle]="pageSubtitle">
    <ng-template #cardContent>
      @if (isInitialLoading()) {
        <div class="nom-dashboard__loading" role="status" aria-live="polite" aria-label="Loading profile">
          <amw-progress-bar mode="indeterminate" color="primary"></amw-progress-bar>
          <span class="sr-only">Loading profile, please wait...</span>
        </div>
      }

      @if (error()) {
        <div class="nom-form__error" role="alert" aria-live="assertive">
          <amw-icon name="error_outline" aria-hidden="true"></amw-icon>
          <span>{{ error() }}</span>
        </div>
        <div class="nom-form__actions">
          <amw-button variant="filled" color="primary" (click)="onRetry()" data-testid="person-profile-retry-btn">Try Again</amw-button>
        </div>
      } @else if (!isInitialLoading()) {
        <form [formGroup]="personForm" (ngSubmit)="onSubmit()" class="nom-form__fields">
          <amw-input
            formControlName="name"
            label="Your Name"
            placeholder="Enter your name"
            icon="person"
            [required]="true"
            data-testid="person-profile-name-input">
          </amw-input>
        </form>
        <div class="nom-form__actions">
          <amw-button type="button" variant="text" (click)="onCancel()" data-testid="person-profile-cancel-btn">
            {{ cancelText }}
          </amw-button>
          <amw-button
            type="submit"
            variant="filled"
            color="primary"
            [disabled]="personForm.invalid || isLoading()"
            [amwValidationTooltip]="validationContext"
            [loading]="isLoading()"
            (click)="onSubmit()"
            data-testid="person-profile-submit-btn">
            {{ submitText }}
          </amw-button>
        </div>
      }
    </ng-template>
  </amw-card>
</div>
