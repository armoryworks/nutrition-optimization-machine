<div class="nom-section">
  <h4 class="nom-section__subheading">Personal Preferences</h4>
  <p class="nom-instruction-text">Customize your plan with your preferences.</p>

  <amw-select
    formControlName="personalPreferenceSpiceLevel"
    label="Preferred Spice Level"
    [options]="getSpiceLevelSelectOptions()"
    class="nom-form__field"
    data-testid="restriction-preference-spice-level-select">
  </amw-select>

  <amw-chip-input
    [formControl]="dislikedIngredientsControl"
    label="Disliked Ingredients"
    placeholder="New disliked ingredient..."
    [suggestions]="allCuratedIngredients"
    [removable]="true"
    [allowCustomValues]="true"
    class="nom-form__field"
    data-testid="restriction-preference-disliked-ingredients-chip-input">
  </amw-chip-input>

  <amw-select
    formControlName="dislikedTextures"
    label="Disliked Textures"
    [options]="getTextureSelectOptions()"
    [multiple]="true"
    (selectionChange)="onMultiSelectChange('dislikedTextures', $event)"
    class="nom-form__field"
    data-testid="restriction-preference-disliked-textures-select">
  </amw-select>

  <amw-select
    formControlName="preferredCookingMethods"
    label="Preferred Cooking Methods"
    [options]="getCookingMethodSelectOptions()"
    [multiple]="true"
    (selectionChange)="onMultiSelectChange('preferredCookingMethods', $event)"
    class="nom-form__field"
    data-testid="restriction-preference-cooking-methods-select">
  </amw-select>
</div>
