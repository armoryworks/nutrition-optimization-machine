<div class="nom-section">
  <h4 class="nom-section__subheading">Societal/Religious/Ethical Practices</h4>
  <p class="nom-instruction-text">
    Select relevant practices and any mandatory inclusions.
  </p>

  <amw-select
    formControlName="societalReligiousEthicalTypeIds"
    label="Practice Types"
    [options]="getPracticeTypeOptions()"
    [multiple]="true"
    (selectionChange)="onMultiSelectChange('societalReligiousEthicalTypeIds', $event)"
    class="nom-form__field"
    data-testid="restriction-societal-practice-types-select">
  </amw-select>

  <amw-chip-input
    [formControl]="mandatoryInclusionsControl"
    label="Mandatory Inclusions"
    placeholder="New inclusion..."
    [suggestions]="allCuratedIngredients"
    [removable]="true"
    [allowCustomValues]="true"
    class="nom-form__field"
    data-testid="restriction-societal-mandatory-inclusions-chip-input">
  </amw-chip-input>

  <amw-textarea
    formControlName="fastingSchedules"
    label="Fasting Schedules"
    placeholder="e.g., Every Friday, Lent"
    class="nom-form__field"
    data-testid="restriction-societal-fasting-schedules-input">
  </amw-textarea>
</div>
