<nom-base-page [config]="pageConfig" (refresh)="onRefresh()" (retry)="onRetry()">
  <div class="recipe-categories">
    <!-- Search and Create Section -->
    <div class="recipe-categories__header">
      <div class="recipe-categories__search">
        <amw-input
          [(ngModel)]="searchTerm"
          (ngModelChange)="filterCategories()"
          label="Search categories"
          placeholder="Search by name or description"
          suffixIcon="search"
          class="recipe-categories__search-field">
        </amw-input>
      </div>
      
      <div class="recipe-categories__actions">
        <amw-button
          variant="filled"
          color="primary"
          (click)="createNewCategory()"
          [disabled]="!categoryForm.valid"
          icon="add">
          Create Category
        </amw-button>
      </div>
    </div>

    <!-- Create Category Form -->
    <amw-card
      *ngIf="categoryForm.get('name')?.value"
      headerTitle="Create New Category"
      class="recipe-categories__form-card">
      <ng-template #contentTemplate>
        <form [formGroup]="categoryForm" class="recipe-categories__form">
          <div class="recipe-categories__form-row">
            <amw-input
              formControlName="name"
              label="Category Name"
              placeholder="Enter category name"
              [required]="true"
              class="recipe-categories__form-field">
            </amw-input>

            <amw-select
              formControlName="icon"
              label="Icon"
              [required]="true"
              [options]="getIconOptions().map(icon => ({ value: icon, label: icon }))"
              class="recipe-categories__form-field">
            </amw-select>

            <amw-input
              formControlName="color"
              label="Color"
              type="color"
              class="recipe-categories__form-field">
            </amw-input>
          </div>

          <div class="recipe-categories__form-row">
            <amw-select
              formControlName="parentCategoryId"
              label="Parent Category (Optional)"
              [options]="[{ value: null, label: 'None' }].concat(allCategories().map(c => ({ value: c.id, label: c.name })))"
              class="recipe-categories__form-field">
            </amw-select>
          </div>

          <amw-textarea
            formControlName="description"
            label="Description (Optional)"
            placeholder="Enter category description"
            [rows]="2"
            class="recipe-categories__form-field">
          </amw-textarea>

          <div class="recipe-categories__form-actions">
            <amw-button variant="text" (click)="categoryForm.reset()">
              Cancel
            </amw-button>
            <amw-button
              variant="filled"
              color="primary"
              (click)="createNewCategory()"
              [disabled]="!categoryForm.valid">
              Create Category
            </amw-button>
          </div>
        </form>
      </ng-template>
    </amw-card>

    <!-- Loading State -->
    <div *ngIf="loading" class="recipe-categories__loading">
      <amw-progress-spinner [diameter]="40"></amw-progress-spinner>
      <p>Loading categories...</p>
    </div>

    <!-- Error State -->
    <div *ngIf="error && !loading" class="recipe-categories__error">
      <amw-card class="recipe-categories__error-card">
        <ng-template #contentTemplate>
          <div class="recipe-categories__error-content">
            <amw-icon name="error" color="warn"></amw-icon>
            <p>{{ error }}</p>
            <amw-button variant="text" color="primary" (click)="onRetry()">
              Try Again
            </amw-button>
          </div>
        </ng-template>
      </amw-card>
    </div>

    <!-- Available Categories -->
    <div *ngIf="!loading && !error" class="recipe-categories__content">
      <amw-card
        headerTitle="Available Categories"
        headerSubtitle="Click to add categories to this recipe"
        class="recipe-categories__available-card">
        <ng-template #contentTemplate>
          <div class="recipe-categories__available-list">
            <div
              *ngFor="let category of filteredCategories"
              class="recipe-categories__available-item"
              [class.recipe-categories__available-item--selected]="isCategorySelected(category)"
              (click)="addCategory(category)"
              (keyup.enter)="addCategory(category)"
              tabindex="0"
              role="button"
              [attr.aria-label]="'Add category: ' + category.name"
            >
              <div class="recipe-categories__category-info">
                <mat-chip
                  [style]="getCategoryStyle(category)"
                  class="recipe-categories__chip"
                  [amwTooltip]="category.description || category.name"
                >
                  <amw-icon [name]="category.icon" class="recipe-categories__chip-icon"></amw-icon>
                  {{ category.name }}
                </mat-chip>
                <div class="recipe-categories__category-details">
                  <span class="recipe-categories__parent" *ngIf="category.parentCategoryId">
                    Parent: {{ getParentCategoryName(category) }}
                  </span>
                  <span class="recipe-categories__recipe-count">
                    {{ category.recipeCount }} recipes
                  </span>
                </div>
              </div>
              <amw-icon-button
                icon="delete"
                (click)="deleteCategory(category); $event.stopPropagation()"
                class="recipe-categories__delete-btn"
                ariaLabel="Delete category">
              </amw-icon-button>
            </div>
          </div>
        </ng-template>
      </amw-card>

      <!-- Selected Categories -->
      <amw-card
        *ngIf="categories.length > 0"
        headerTitle="Selected Categories"
        headerSubtitle="Categories assigned to this recipe"
        class="recipe-categories__selected-card">
        <ng-template #contentTemplate>
          <div class="recipe-categories__selected-list">
            <mat-chip
              *ngFor="let category of categories"
              [style]="getCategoryStyle(category)"
              class="recipe-categories__chip recipe-categories__chip--selected"
              [amwTooltip]="category.description || category.name"
            >
              <amw-icon [name]="category.icon" class="recipe-categories__chip-icon"></amw-icon>
              {{ category.name }}
              <button
                matChipRemove
                (click)="removeCategory(category)"
                [amwTooltip]="'Remove category'"
              >
                <amw-icon name="cancel"></amw-icon>
              </button>
            </mat-chip>
          </div>
        </ng-template>
      </amw-card>
    </div>
  </div>
</nom-base-page>
