<nom-base-detail
  [config]="detailConfig"
  [loading]="isLoading()"
  [error]="error()">

  <div class="recipe-share-token__content">
    <!-- Create Share Token Form -->
    <form [formGroup]="shareTokenForm" (ngSubmit)="createShareToken()" class="recipe-share-token__form">
      <div class="recipe-share-token__form-row">
        <amw-input
          formControlName="shareName"
          label="Share Name (Optional)"
          placeholder="Enter a name for this share"
          class="recipe-share-token__field">
        </amw-input>
      </div>

      <div class="recipe-share-token__form-row">
        <amw-select
          formControlName="isPublic"
          label="Access Level"
          [options]="[
            { value: false, label: 'Private - Only with token' },
            { value: true, label: 'Public - Anyone can access' }
          ]"
          class="recipe-share-token__field">
        </amw-select>
      </div>

      <div class="recipe-share-token__form-actions">
        <amw-button
          variant="filled"
          color="primary"
          type="submit"
          [disabled]="shareTokenForm.invalid || isSubmitting()"
          [loading]="isSubmitting()"
          icon="add"
          class="recipe-share-token__submit-btn">
          {{ isSubmitting() ? 'Creating...' : 'Create Share Token' }}
        </amw-button>
      </div>
    </form>

    <amw-divider dividerClass="recipe-share-token__divider"></amw-divider>

    <!-- Share Tokens List -->
    <div class="recipe-share-token__tokens-section">
      <h3 class="recipe-share-token__section-title">Active Share Tokens</h3>

             <div *ngIf="shareTokens().length === 0 && !isLoading()" class="recipe-share-token__empty">
         <amw-icon name="share" class="recipe-share-token__empty-icon"></amw-icon>
         <p>No share tokens created yet</p>
       </div>

             <div *ngIf="shareTokens().length > 0" class="recipe-share-token__tokens-list">
         <div *ngFor="let shareToken of shareTokens(); trackBy: trackByShareTokenId" class="recipe-share-token__token-item">
           <div class="recipe-share-token__token-info">
             <div class="recipe-share-token__token-header">
               <h4 class="recipe-share-token__token-name">
                 {{ shareToken.shareName || 'Unnamed Share' }}
               </h4>
               <amw-chip
                 [label]="shareToken.isPublic ? 'Public' : 'Private'"
                 [color]="shareToken.isPublic ? 'accent' : 'primary'"
                 chipClass="recipe-share-token__token-chip">
               </amw-chip>
             </div>
             
             <div class="recipe-share-token__token-details">
               <p class="recipe-share-token__token-url">
                 <strong>Share URL:</strong> 
                 <span class="recipe-share-token__token-text">{{ getShareUrl(shareToken.shareToken) }}</span>
               </p>
               <p class="recipe-share-token__token-date">
                 <strong>Created:</strong> {{ formatDate(shareToken.createdDate) }}
               </p>
             </div>
           </div>

           <div class="recipe-share-token__token-actions">
             <amw-icon-button
               icon="content_copy"
               ariaLabel="Copy share URL"
               [amwTooltip]="'Copy share URL'"
               (buttonClick)="copyShareToken(shareToken.shareToken)"
               class="recipe-share-token__copy-btn">
             </amw-icon-button>
             <amw-icon-button
               icon="delete"
               color="warn"
               ariaLabel="Delete share token"
               [amwTooltip]="'Delete share token'"
               (buttonClick)="deleteShareToken(shareToken.id)"
               class="recipe-share-token__delete-btn">
             </amw-icon-button>
           </div>
         </div>
       </div>
    </div>
  </div>
</nom-base-detail>
