<div class="nom-form--full">
  <nom-ingredient-form
    data-testid="ingredient-edit-form"
    [mode]="isEditMode ? 'edit' : 'create'"
    [ingredient]="ingredient"
    [isModal]="false"
    [showDuplicateChecking]="false"
    [showNavigation]="true"
    (formSubmitted)="onFormSubmitted($event)"
    (formCancelled)="onFormCancelled()">
  </nom-ingredient-form>
</div>
