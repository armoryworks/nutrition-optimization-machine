@if (ingredient) {
  <nom-base-detail
    [config]="detailConfig"
    (back)="onBack()">

    <div class="ingredient-details__content">
      @if (nutritionLabelData) {
        <nom-nutrition-label [data]="nutritionLabelData"></nom-nutrition-label>
      } @else {
        <p>No nutrition data to display.</p>
      }
    </div>
  </nom-base-detail>
}
