@if (ingredient) {
  <app-base-detail
    [config]="detailConfig"
    (back)="onBack()">

    <div class="ingredient-details__content">
      @if (nutritionLabelData) {
        <app-nutrition-label [data]="nutritionLabelData"></app-nutrition-label>
      } @else {
        <p>No nutrition data to display.</p>
      }
    </div>
  </app-base-detail>
}
