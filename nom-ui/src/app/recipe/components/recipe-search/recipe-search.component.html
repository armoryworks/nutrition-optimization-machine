<div class="recipe-search">
  <div class="recipe-search__container">
    <!-- Public Landing Page -->
    <div class="recipe-search__public-landing">
      <mat-card class="recipe-search__welcome-card">
        <mat-card-header>
          <mat-card-title>Discover Amazing Recipes</mat-card-title>
          <mat-card-subtitle>Browse our collection of delicious recipes from around the world</mat-card-subtitle>
        </mat-card-header>
        
        <mat-card-content>
          <div class="recipe-search__public-actions">
            <button mat-raised-button color="primary" (click)="browsePublicRecipes()">
              <mat-icon>restaurant</mat-icon>
              Browse Recipes
            </button>
            
            <div class="recipe-search__auth-prompt">
              <p>Want to create your own recipes and save favorites?</p>
              <div class="recipe-search__auth-buttons">
                <button mat-button color="accent" (click)="onLogin()">
                  <mat-icon>login</mat-icon>
                  Login
                </button>
                <button mat-button color="accent" (click)="onRegister()">
                  <mat-icon>person_add</mat-icon>
                  Create Account
                </button>
              </div>
            </div>
          </div>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
