<!-- Ingredient Create Modal - Now uses unified ingredient form component -->

<nom-ingredient-form
  [mode]="'create'"
  [isModal]="true"
  [modalData]="data"
  [showDuplicateChecking]="true"
  [showNavigation]="false"
  (formSubmitted)="onFormSubmitted($event)"
  (formCancelled)="onFormCancelled()"
  (duplicateFound)="onDuplicateFound($event)">
</nom-ingredient-form>
