<div class="nom-search">
  <amw-card
    headerTitle="Search for an Ingredient"
    headerSubtitle="Find nutritional information for any ingredient"
    headerIcon="search">
    <ng-template #cardContent>
      <!-- Search form -->
      <div class="nom-search__form">
        <amw-autocomplete
          [formControl]="searchControl"
          label="Search for an Ingredient"
          placeholder="e.g., chicken breast, rice, tomato"
          [options]="autocompleteOptions()"
          [loading]="isLoading()"
          startIcon="search"
          [displayWith]="displayFn"
          noResultsText="No ingredients found"
          (inputChanged)="onInputChanged($event)"
          (optionSelected)="onOptionSelected($event)"
          [hasError]="!!error()"
          [errorMessage]="error() || ''"
          class="nom-search__field">
        </amw-autocomplete>
      </div>

      @if (isLoading()) {
        <div class="nom-search__loading">
          <amw-progress-bar mode="indeterminate" color="primary"></amw-progress-bar>
        </div>
      }

      <!-- Ingredient details as card content -->
      @if (selectedIngredient()) {
        <nom-ingredient-details [ingredient]="selectedIngredient()!"></nom-ingredient-details>
      } @else {
        <div class="nom-search__empty">
          <amw-icon name="search" class="nom-search__empty-icon"></amw-icon>
          <h3 class="nom-search__empty-title">Search for an Ingredient</h3>
          <p class="nom-search__empty-message">Enter an ingredient name above to view detailed nutritional information</p>
        </div>
      }
    </ng-template>
  </amw-card>
</div>
