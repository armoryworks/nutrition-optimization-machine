<div class="recipe-rating">
  <div class="recipe-rating__container">
    <!-- Header -->
    <div class="recipe-rating__header">
      <div class="recipe-rating__header-content">
        <div class="recipe-rating__title-section">
          <amw-icon name="star" class="recipe-rating__title-icon"></amw-icon>
          <div class="recipe-rating__title-info">
            <h2 class="recipe-rating__title">Rate This Recipe</h2>
            <p class="recipe-rating__subtitle">Share your rating and review</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Rating Form -->
    <amw-card
      headerTitle="Your Rating"
      headerIcon="star"
      class="recipe-rating__form-card">
      <ng-template #contentTemplate>
        <form [formGroup]="ratingForm" (ngSubmit)="onSubmit()" class="recipe-rating__form">
          <!-- Star Rating -->
          <div class="recipe-rating__stars-section">
            <div class="recipe-rating__stars-label">Your Rating:</div>
            <div class="recipe-rating__stars" role="radiogroup" aria-label="Recipe rating from 1 to 5 stars">
              @for (star of [1,2,3,4,5]; track star) {
                <amw-icon
                  name="star"
                  [class]="getStarClass(star) + ' recipe-rating__star recipe-rating__star--clickable'"
                  (click)="setRating(star)"
                  role="radio"
                  [attr.aria-checked]="ratingForm.get('rating')?.value === star"
                  tabindex="0"
                  (keyup.enter)="setRating(star)"
                  (keyup.space)="setRating(star)">
                </amw-icon>
              }
            </div>
            <span class="recipe-rating__rating-text">
              {{ ratingForm.get('rating')?.value || 0 }} out of 5
            </span>
          </div>

          <!-- Review Text -->
          <amw-textarea
            formControlName="reviewText"
            label="Review (Optional)"
            placeholder="Share your thoughts about this recipe..."
            [rows]="4"
            class="recipe-rating__field">
          </amw-textarea>

          <div class="recipe-rating__form-actions">
            <amw-button
              variant="filled"
              color="primary"
              type="submit"
              [disabled]="ratingForm.invalid || isSubmitting()"
              [loading]="isSubmitting()"
              icon="star"
              class="recipe-rating__submit-btn">
              Submit Rating
            </amw-button>
          </div>
        </form>
      </ng-template>
    </amw-card>
  </div>
</div>
