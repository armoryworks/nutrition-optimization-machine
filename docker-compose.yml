version: "3.8"

services:
  # NOM Backend API
  nom-api:
    container_name: nom_api
    build:
      context: ./nom-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - ConnectionStrings__NomConnection=Host=postgres;Database=nom;Username=nom;Password=${POSTGRES_PASSWORD}
      - AllowedOrigins=${ALLOWED_ORIGINS}
      # Public URL of the UI, used in account emails (confirmation links).
      - Frontend__Url=${FRONTEND_URL:-http://localhost:4210}
      # SMTP (optional). Leave EMAIL_SMTP_HOST empty to disable outbound email.
      - Email__SmtpHost=${EMAIL_SMTP_HOST:-}
      - Email__SmtpPort=${EMAIL_SMTP_PORT:-587}
      - Email__SmtpUser=${EMAIL_SMTP_USER:-}
      - Email__SmtpPassword=${EMAIL_SMTP_PASSWORD:-}
      - Email__FromAddress=${EMAIL_FROM_ADDRESS:-noreply@nom.local}
      - Email__FromName=${EMAIL_FROM_NAME:-NOM}
      - Email__UseSsl=${EMAIL_USE_SSL:-true}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nom-network
    volumes:
      - nom_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # NOM Frontend
  nom-ui:
    container_name: nom_ui
    build:
      context: ./nom-ui
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${UI_PORT:-80}:80"
    depends_on:
      - nom-api
    networks:
      - nom-network

  # PostgreSQL Database
  postgres:
    container_name: nom_postgres
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nom}
      POSTGRES_USER: ${POSTGRES_USER:-nom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # PG18 moved the image default to /var/lib/postgresql/18/docker; keep the
      # historical path so the existing data volume and runbooks still line up.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nom-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nom} -d ${POSTGRES_DB:-nom}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nom_data:
    driver: local
  postgres_data:
    driver: local

networks:
  nom-network:
    driver: bridge
