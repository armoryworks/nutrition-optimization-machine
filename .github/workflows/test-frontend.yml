name: Test Frontend (Angular)

on:
  push:
    branches: [main, develop]
    paths: ["nom-ui/**"]
  pull_request:
    branches: [main, develop]
    paths: ["nom-ui/**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: nom-ui/package-lock.json

      - name: Install dependencies
        run: |
          cd nom-ui
          npm ci

      - name: Run linting
        run: |
          cd nom-ui
          npm run lint

      - name: Lint data-testid coverage
        # CLAUDE.md requires data-testid on every interactive element. Per-file ratchet
        # against nom-ui/scripts/testid-baseline.json: new templates must be 100% covered,
        # baselined ones can't get worse; record improvements with
        # NOM_TESTID_UPDATE_BASELINE=1. See scripts/lint-testids.mjs.
        run: |
          cd nom-ui
          npm run lint:testids

      - name: Run unit tests
        run: |
          cd nom-ui
          npm run test:ci

      - name: Build for production
        run: |
          cd nom-ui
          npm run build -- --configuration production
