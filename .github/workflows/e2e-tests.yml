name: E2E Tests (Primary Regression)

on:
  push:
    branches: [main, develop]
    paths:
      - "nom-ui/**"
      - "nom-api/**"
      - "nom-test/**"
      - "docker-compose.test.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "nom-ui/**"
      - "nom-api/**"
      - "nom-test/**"
      - "docker-compose.test.yml"

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Create environment file
      run: |
        cat > .env << EOF
        POSTGRES_TEST_DB=nom_test
        POSTGRES_USER=nom
        POSTGRES_PASSWORD=test_password_${{ github.run_id }}
        JWT_SECRET_KEY=test_jwt_secret_key_minimum_32_characters_long_${{ github.run_id }}
        API_TEST_PORT=8082
        UI_TEST_PORT=4211
        EOF

    - name: Start test environment
      run: docker compose -f docker-compose.test.yml up -d --build

    - name: Wait for services to be healthy
      run: |
        echo "Waiting for PostgreSQL..."
        timeout 60 bash -c 'until docker exec nom_postgres_test pg_isready -U nom -d nom_test; do sleep 2; done'
        echo "Waiting for API..."
        timeout 120 bash -c 'until curl -sf http://localhost:8082/health; do sleep 3; done'
        echo "Waiting for UI..."
        timeout 60 bash -c 'until curl -sf http://localhost:4211; do sleep 2; done'

    - name: Seed admin account
      run: |
        # Register the admin user the admin-curation spec expects, then grant the
        # stored admin claims directly (deterministic, unlike _GrantInitialAdminClaims.sql).
        curl -sf -X POST http://localhost:8082/api/auth/register-custom \
          -H 'Content-Type: application/json' \
          -d '{"email":"admin@example.com","password":"AdminPassword123!","confirmPassword":"AdminPassword123!","fullName":"Test Admin"}'
        docker exec nom_postgres_test psql -U nom -d nom_test -v ON_ERROR_STOP=1 -c "
          INSERT INTO auth.\"AspNetUserClaims\" (\"UserId\", \"ClaimType\", \"ClaimValue\")
          SELECT u.\"Id\", c.claim, 'true'
          FROM auth.\"AspNetUsers\" u
          CROSS JOIN (VALUES ('CanManageCuration'), ('CanManageUserRoles')) AS c(claim)
          WHERE u.\"Email\" = 'admin@example.com'
            AND NOT EXISTS (
              SELECT 1 FROM auth.\"AspNetUserClaims\" x
              WHERE x.\"UserId\" = u.\"Id\" AND x.\"ClaimType\" = c.claim);"

    - name: Install test dependencies
      working-directory: ./nom-test
      run: npm ci

    - name: Run Cypress E2E tests
      working-directory: ./nom-test
      env:
        CYPRESS_BASE_URL: http://localhost:4211
        CYPRESS_API_URL: http://localhost:8082
        CYPRESS_ADMIN_EMAIL: admin@example.com
        CYPRESS_ADMIN_PASSWORD: AdminPassword123!
      run: npm run test:e2e

    - name: Upload screenshots on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: cypress-screenshots
        path: nom-test/cypress/screenshots
        retention-days: 7

    - name: Display logs on failure
      if: failure()
      run: docker compose -f docker-compose.test.yml logs
    - name: Stop test environment
      if: always()
      run: docker compose -f docker-compose.test.yml down -v

