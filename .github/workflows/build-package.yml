# Build + push the NOM app images to GHCR under the armoryworks org (the
# deployment infrastructure pulls ghcr.io/armoryworks/nom-api|nom-ui — see the
# armoryworks/nommeal-deploy repo). This repo lives in the armoryworks org,
# so the default GITHUB_TOKEN can publish the packages directly.
#
# Tags pushed per image:
#   latest        floating
#   <git tag>     on v* tag pushes (e.g. v1.2.0)
#   sha-<sha>     immutable, what deploys should pin
#
# Every image carries the OpenContainers metadata labels, so an artifact can
# say what it is without being asked what tag it was pulled under. That matters
# for anything running a floating tag: `latest` moves, and afterwards the only
# way to identify what a container is actually running is to read it off the
# image itself. The fleet control plane reads these to report real versions.
#
# Detached builds: each image only REBUILDS when its directory changed since
# the previous v* tag (or when this workflow changed); otherwise the previous
# tag's image is retagged in the registry (manifest-only, seconds). Every v*
# tag therefore still carries both images — deploy the same tag to the nom-ui
# (web box) and nom-api (api box) components — but a UI-only fix no longer
# rebuilds the API, and vice versa.

name: Build and Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-api:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/armoryworks/nom-api
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags + diff against the previous release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide build vs retag
        id: mode
        run: |
          PREV=$(git describe --tags --match 'v*' --abbrev=0 HEAD^ 2>/dev/null || true)
          MODE=build
          if [ -n "$PREV" ] \
             && git diff --quiet "$PREV" HEAD -- nom-api .github/workflows/build-package.yml \
             && docker buildx imagetools inspect "$IMAGE:$PREV" >/dev/null 2>&1; then
            MODE=retag
          fi
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "nom-api: $MODE (previous release: ${PREV:-<none>})"

      - name: Build and push API image
        if: steps.mode.outputs.mode == 'build'
        uses: docker/build-push-action@v7
        with:
          context: ./nom-api
          push: true
          tags: |
            ghcr.io/armoryworks/nom-api:latest
            ghcr.io/armoryworks/nom-api:${{ github.ref_name }}
            ghcr.io/armoryworks/nom-api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=nom-api
            org.opencontainers.image.description=NOM API - meal planning for mixed-diet households
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Retag unchanged API image
        if: steps.mode.outputs.mode == 'retag'
        run: |
          # imagetools copies the previous release's manifest, so the image
          # CONFIG labels keep naming the build the bits came from — which is
          # true, and is what identifies the artifact. Annotate the manifest
          # with the release it is published under so a consumer can tell both
          # apart: "these bits are $prev, shipped as $ref_name".
          # --annotation needs buildx >= 0.12. Never let metadata break a
          # release: if it is unsupported, publish the tags anyway and say so.
          if ! docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.version=${{ github.ref_name }}" \
            --annotation "index:org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "index:org.opencontainers.image.base.name=$IMAGE:${{ steps.mode.outputs.prev }}" \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${{ github.ref_name }}" \
            -t "$IMAGE:sha-${{ github.sha }}" \
            "$IMAGE:${{ steps.mode.outputs.prev }}"; then
            echo "::warning::annotations unsupported by this buildx; retagging without them" >&2
            docker buildx imagetools create \
              -t "$IMAGE:latest" \
              -t "$IMAGE:${{ github.ref_name }}" \
              -t "$IMAGE:sha-${{ github.sha }}" \
              "$IMAGE:${{ steps.mode.outputs.prev }}"
          fi

  build-ui:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/armoryworks/nom-ui
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags + diff against the previous release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide build vs retag
        id: mode
        run: |
          PREV=$(git describe --tags --match 'v*' --abbrev=0 HEAD^ 2>/dev/null || true)
          MODE=build
          if [ -n "$PREV" ] \
             && git diff --quiet "$PREV" HEAD -- nom-ui .github/workflows/build-package.yml \
             && docker buildx imagetools inspect "$IMAGE:$PREV" >/dev/null 2>&1; then
            MODE=retag
          fi
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "nom-ui: $MODE (previous release: ${PREV:-<none>})"

      - name: Build and push UI image
        if: steps.mode.outputs.mode == 'build'
        uses: docker/build-push-action@v7
        with:
          context: ./nom-ui
          push: true
          tags: |
            ghcr.io/armoryworks/nom-ui:latest
            ghcr.io/armoryworks/nom-ui:${{ github.ref_name }}
            ghcr.io/armoryworks/nom-ui:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=nom-ui
            org.opencontainers.image.description=NOM web client - meal planning for mixed-diet households
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Retag unchanged UI image
        if: steps.mode.outputs.mode == 'retag'
        run: |
          # imagetools copies the previous release's manifest, so the image
          # CONFIG labels keep naming the build the bits came from — which is
          # true, and is what identifies the artifact. Annotate the manifest
          # with the release it is published under so a consumer can tell both
          # apart: "these bits are $prev, shipped as $ref_name".
          # --annotation needs buildx >= 0.12. Never let metadata break a
          # release: if it is unsupported, publish the tags anyway and say so.
          if ! docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.version=${{ github.ref_name }}" \
            --annotation "index:org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "index:org.opencontainers.image.base.name=$IMAGE:${{ steps.mode.outputs.prev }}" \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${{ github.ref_name }}" \
            -t "$IMAGE:sha-${{ github.sha }}" \
            "$IMAGE:${{ steps.mode.outputs.prev }}"; then
            echo "::warning::annotations unsupported by this buildx; retagging without them" >&2
            docker buildx imagetools create \
              -t "$IMAGE:latest" \
              -t "$IMAGE:${{ github.ref_name }}" \
              -t "$IMAGE:sha-${{ github.sha }}" \
              "$IMAGE:${{ steps.mode.outputs.prev }}"
          fi
