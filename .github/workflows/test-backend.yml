name: Test Backend (.NET)

on:
  push:
    branches: [main, develop]
    paths: ["nom-api/**", "db/**"]
  pull_request:
    branches: [main, develop]
    paths: ["nom-api/**", "db/**"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nom_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore nom-api/nom-api.sln

      - name: Build
        run: dotnet build nom-api/nom-api.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test nom-api/nom-api.sln --no-build --verbosity normal --configuration Release --collect:"XPlat Code Coverage"

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          # `files` takes explicit paths, not globs — the CLI's own search is what
          # actually finds TestResults/<guid>/coverage.cobertura.xml. Scope it.
          directory: ./nom-api
          flags: backend
          name: backend-coverage
          # Tokenless upload is unsupported since v4 except for fork PRs.
          token: ${{ secrets.CODECOV_TOKEN }}
          # Fail loudly rather than silently skipping the upload — a bad token or
          # a missing report should not leave CI green with no coverage.
          fail_ci_if_error: true

  schema-drift:
    # Guards the declarative schema workflow: fails if entities in Nom.Data
    # changed without regenerating db/schema.sql (see db/README.md).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nom
          POSTGRES_PASSWORD: dev_password
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      # Runner images now ship .NET 10 alongside 9; without a restore the
      # `dotnet ef dbcontext script` build path fails with NETSDK1004.
      - name: Restore and build for dotnet-ef
        run: dotnet build nom-api/nom-api.sln -c Debug

      - name: Check schema.sql is in sync with the EF model
        env:
          DB_SUPERUSER: nom
        run: ./db/sync-from-model.sh --check
