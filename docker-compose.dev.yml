version: "3.8"

# Development-only setup
# Runs PostgreSQL in a container, while API and UI run natively
# This allows for faster development with hot reload

services:
  # PostgreSQL Database for Development
  postgres-dev:
    container_name: nom_postgres_dev
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nom_dev}
      POSTGRES_USER: ${POSTGRES_USER:-nom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      # PG18 moved the image default to /var/lib/postgresql/18/docker; keep the
      # historical path so the existing data volume and runbooks still line up.
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"  # Expose to host for local development
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      # Declarative schema + seed applied automatically on first container init.
      # (_GrantInitialAdminClaims.sql must run manually AFTER the first user registers.)
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - nom-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nom} -d ${POSTGRES_DB:-nom_dev}"]
      interval: 5s
      timeout: 3s
      retries: 5


  # Optional: pgAdmin for database management
  pgadmin:
    container_name: nom_pgadmin
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@nom.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - nom-dev-network
    depends_on:
      - postgres-dev
    profiles:
      - tools  # Only starts when explicitly requested

volumes:
  postgres_dev_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  nom-dev-network:
    driver: bridge
