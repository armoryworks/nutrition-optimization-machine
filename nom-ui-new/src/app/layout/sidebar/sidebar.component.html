<section class="nom-sidebar-panel" data-testid="sidebar-upcoming-meals">
  <div class="nom-sidebar-panel__header">
    <mat-icon class="nom-sidebar-panel__icon">calendar_today</mat-icon>
    <h3 class="nom-sidebar-panel__title">Upcoming Meals</h3>
  </div>
  <div class="nom-sidebar-panel__body">
    <div class="nom-sidebar-panel__empty">
      <span class="nom-sidebar-panel__empty-text">No meals planned</span>
      <a class="nom-sidebar-panel__link" href="#">View all meal plans &rarr;</a>
    </div>
  </div>
</section>

<section class="nom-sidebar-panel" data-testid="sidebar-shopping-lists">
  <div class="nom-sidebar-panel__header">
    <mat-icon class="nom-sidebar-panel__icon">shopping_cart</mat-icon>
    <h3 class="nom-sidebar-panel__title">Shopping Lists</h3>
  </div>
  <div class="nom-sidebar-panel__body">
    <div class="nom-sidebar-panel__empty">
      <span class="nom-sidebar-panel__empty-text">No active shopping lists</span>
      <a class="nom-sidebar-panel__link" href="#">View all lists &rarr;</a>
    </div>
  </div>
</section>

<section class="nom-sidebar-panel" data-testid="sidebar-quick-actions">
  <div class="nom-sidebar-panel__header">
    <mat-icon class="nom-sidebar-panel__icon">bolt</mat-icon>
    <h3 class="nom-sidebar-panel__title">Quick Actions</h3>
  </div>
  <div class="nom-sidebar-panel__body">
    <div class="nom-sidebar-panel__actions">
      <button mat-stroked-button class="nom-sidebar-panel__action-btn">
        <mat-icon>add</mat-icon>
        <span>New Plan</span>
      </button>
      <button mat-stroked-button class="nom-sidebar-panel__action-btn">
        <mat-icon>restaurant_menu</mat-icon>
        <span>New Recipe</span>
      </button>
      <button mat-stroked-button class="nom-sidebar-panel__action-btn">
        <mat-icon>shopping_cart</mat-icon>
        <span>Shop</span>
      </button>
      <button mat-stroked-button class="nom-sidebar-panel__action-btn">
        <mat-icon>search</mat-icon>
        <span>Search</span>
      </button>
    </div>
  </div>
</section>
