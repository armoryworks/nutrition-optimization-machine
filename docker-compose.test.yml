# E2E Testing Setup
# Isolated environment for running Cypress tests
# Uses separate database to avoid interfering with development

services:
  # PostgreSQL Database for Testing
  postgres-test:
    container_name: nom_postgres_test
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-nom_test}
      POSTGRES_USER: ${POSTGRES_USER:-nom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-test_password}
    ports:
      - "${POSTGRES_TEST_PORT:-5433}:5432"  # Different port to avoid conflicts
    volumes:
      # Declarative schema + seed applied automatically on first container init.
      # (_GrantInitialAdminClaims.sql must run manually AFTER the first user
      # registers — it cannot live in initdb.d, where no users exist yet.)
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - nom-test-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nom} -d ${POSTGRES_TEST_DB:-nom_test}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  nom-api-test:
    container_name: nom_api_test
    build:
      context: ./nom-api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - ConnectionStrings__NomConnection=Host=postgres-test;Database=${POSTGRES_TEST_DB:-nom_test};Username=${POSTGRES_USER:-nom};Password=${POSTGRES_PASSWORD:-test_password}
      - AllowedOrigins=http://localhost:4210,http://localhost:4211
    ports:
      - "${API_TEST_PORT:-8082}:8080"
    depends_on:
      postgres-test:
        condition: service_healthy
    networks:
      - nom-test-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # NOM UI for Testing
  nom-ui-test:
    container_name: nom_ui_test
    build:
      context: ./nom-ui
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${UI_TEST_PORT:-4212}:80"
    depends_on:
      nom-api-test:
        condition: service_healthy
    networks:
      - nom-test-network
    environment:
      - API_URL=http://nom-api-test:8080

networks:
  nom-test-network:
    driver: bridge
